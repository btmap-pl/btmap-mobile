org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Free the build daemon (and its RAM/CPU) after 10 idle minutes instead of the default 3 hours.
org.gradle.daemon.idletimeout=600000
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36

# BTMap backend used for station lookups. With the phone on USB, `adb reverse tcp:3001 tcp:3001`
# lets the app reach a local `pnpm server` at 127.0.0.1:3001.
btmap.apiBaseUrl=http://127.0.0.1:3001
